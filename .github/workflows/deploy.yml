name: CI/CD Pipeline Sama-Docteur

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API
        uses: docker/build-push-action@v4
        with:
          context: ./api
          push: true
          tags: mohamedloum1001/sama-docteur-api:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: mohamedloum1001/sama-docteur-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Azure via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Nettoyage
            docker stop sama-api sama-frontend || true
            docker rm sama-api sama-frontend || true

            # Pull des images
            docker pull mohamedloum1001/sama-docteur-api:latest
            docker pull mohamedloum1001/sama-docteur-frontend:latest

            # Lancement de l'API avec les variables Firebase
            docker run -d --name sama-api \
              -p 8000:8000 \
              -e FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
              -e FIREBASE_CLIENT_EMAIL="${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
              -e FIREBASE_PRIVATE_KEY="${{ secrets.FIREBASE_PRIVATE_KEY }}" \
              mohamedloum1001/sama-docteur-api:latest

            # Lancement du Frontend
            docker run -d --name sama-frontend -p 80:80 mohamedloum1001/sama-docteur-frontend:latest
