# Redirection automatique du trafic HTTP vers HTTPS
server {
    listen 80;
    server_name api.sama-docteur.fr;
    return 301 https://$host$request_uri;
}

# Bloc de serveur HTTPS sécurisé
server {
    listen 443 ssl http2;
    server_name api.sama-docteur.fr;

    # Certificats SSL / TLS (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.sama-docteur.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sama-docteur.fr/privkey.pem;

    # Protocoles cryptographiques sécurisés (Standards OWASP)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # En-têtes de sécurité HTTP (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Redirection du flux vers l'API Node.js / Express
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Transmission des entêtes WebSocket et HTTP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SÉCURITÉ : Limite de taille des requêtes (ex: upload de documents/signatures)
        client_max_body_size 10M;

        # Timeouts de sécurité pour éviter le blocage des workers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}